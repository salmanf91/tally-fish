  <path d="M120 256C120 200 170 160 250 160C340 160 410 210 440 256C410 302 340 352 250 352C170 352 120 312 120 256Z" fill="url(#cyanGrad)" fill-opacity="0.2" stroke="url(#cyanGrad)" stroke-width="16" stroke-linejoin="round"/>
  <!-- Tail fin -->
  <path d="M140 256L70 190V322L140 256Z" fill="url(#cyanGrad)" stroke="url(#cyanGrad)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Fish Eye -->
  <circle cx="360" cy="240" r="16" fill="#f8fafc"/>
  <circle cx="364" cy="238" r="8" fill="#081120"/>

  <!-- Weighing Scale / Tally Balance Beam (Gold) -->
