  </defs>
  <!-- Background Badge -->
  <rect width="512" height="512" rx="128" fill="url(#marineGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

